<title>Feed Fetch Test</title>
<style>
  /* Layout: single column utility page, input on top, result panels below */
  :root {
    --bg: #f6f7f5;
    --fg: #1d2420;
    --muted: #5d6a62;
    --line: #d5dbd7;
    --panel: #ffffff;
    --accent: #1f6f54;
    --accent-fg: #ffffff;
    --bad: #b3261e;
    --good: #1f6f54;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --fg: #e6ece8; --muted: #93a39a; --line: #2b3630;
      --panel: #1a221e; --accent: #5cc4a0; --accent-fg: #0d1511;
      --bad: #ff8a80; --good: #5cc4a0; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --fg: #e6ece8; --muted: #93a39a; --line: #2b3630;
    --panel: #1a221e; --accent: #5cc4a0; --accent-fg: #0d1511;
    --bad: #ff8a80; --good: #5cc4a0; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  p { margin: 0; color: var(--muted); }
  label { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  textarea { width: 100%; box-sizing: border-box; min-height: 6rem; font: 13px/1.4 var(--mono); padding: .6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
  button { font: inherit; font-weight: 600; padding: .7rem 1.2rem; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-fg); cursor: pointer; align-self: flex-start; }
  button:disabled { opacity: .6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .75rem; min-width: 0; }
  section h2 { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
  pre { margin: 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto; }
  .verdict { font-weight: 600; }
  .ok { color: var(--good); } .fail { color: var(--bad); }
</style>

<main>
  <h1>Feed Fetch Test</h1>
  <p>Paste the feed URL and press Fetch. The page asks the browser to fetch it with a script, which is what a web page would do. Nothing is stored or sent anywhere else.</p>
  <label for="url">Feed URL</label>
  <textarea id="url" spellcheck="false" placeholder="https://eu-west-1-production-apis.toddleapp.com/calendar/v1/feed/basic.ics?accessToken=...&uid=..."></textarea>
  <button id="go" type="button">Fetch</button>

  <section><h2>Verdict</h2><div id="verdict" class="verdict">Not run yet.</div></section>
  <section><h2>Response headers the page can read</h2><pre id="headers">-</pre></section>
  <section><h2>Body (first 3000 characters)</h2><pre id="body">-</pre></section>
</main>

<script>
  var go = document.getElementById('go');
  var verdict = document.getElementById('verdict');
  var headersEl = document.getElementById('headers');
  var bodyEl = document.getElementById('body');
  var cspBlocked = null;

  document.addEventListener('securitypolicyviolation', function (e) {
    cspBlocked = e.violatedDirective + ' (' + e.blockedURI + ')';
  });

  function say(text, cls) { verdict.textContent = text; verdict.className = 'verdict ' + (cls || ''); }

  go.addEventListener('click', async function () {
    var url = document.getElementById('url').value.trim();
    if (!url) { say('Paste the URL first.', 'fail'); return; }
    go.disabled = true; cspBlocked = null;
    say('Fetching...'); headersEl.textContent = '-'; bodyEl.textContent = '-';
    try {
      var res = await fetch(url, { mode: 'cors' });
      var lines = [];
      res.headers.forEach(function (v, k) { lines.push(k + ': ' + v); });
      headersEl.textContent = lines.length ? lines.join('\n') : '(no readable headers)';
      var text = await res.text();
      bodyEl.textContent = text.slice(0, 3000);
      var events = (text.match(/BEGIN:VEVENT/g) || []).length;
      say('Worked. HTTP ' + res.status + ', ' + text.length + ' characters, ' + events + ' events. A web page can read this feed.', 'ok');
    } catch (err) {
      await new Promise(function (r) { setTimeout(r, 50); });
      var out = String(err && err.name) + ': ' + String(err && err.message);
      if (err && err.stack) out += '\n\n' + err.stack;
      if (cspBlocked) out += '\n\nsecuritypolicyviolation: ' + cspBlocked;
      say('Error', 'fail');
      bodyEl.textContent = out;
    } finally {
      go.disabled = false;
    }
  });
</script>
